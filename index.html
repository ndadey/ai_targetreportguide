<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Target Report Guide — Table 2</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1a1f2e;--paper:#f8f5f0;--cream:#ede9e2;--rule:#d4cfc6;
    --accent:#2a5fa5;--accent-lt:#e8eef8;
    --yes:#1a6b45;--yes-lt:#e6f4ed;
    --no:#8b3a0f;--no-lt:#fdf0e8;
    --warn:#6b5200;--warn-lt:#fffae6;
    --step:#3b2f6e;--step-lt:#eeecf8;
    --mid:#555;--radius:6px;--shadow:0 2px 12px rgba(0,0,0,.09);
    --chat-bg:#1e2540;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Sans 3',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:0 0 80px;}

  header{background:var(--ink);color:#fff;padding:32px 40px 28px;border-bottom:4px solid var(--accent);}
  header .label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#9ab0d4;margin-bottom:8px;}
  header h1{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,34px);line-height:1.2;font-weight:700;}
  header p{margin-top:10px;font-size:14px;color:#b8c9e0;max-width:640px;line-height:1.6;}

  .progress-bar-wrap{background:var(--cream);border-bottom:1px solid var(--rule);padding:14px 40px;display:flex;align-items:center;gap:16px;}
  .progress-track{flex:1;height:6px;background:var(--rule);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}
  .progress-label{font-size:12px;font-weight:600;color:var(--mid);white-space:nowrap;min-width:80px;text-align:right;}

  main{max-width:820px;margin:48px auto 0;padding:0 24px;}
  .card{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 36px;animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  .step-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:16px;}
  .step-tag.observation{background:var(--accent-lt);color:var(--accent);}
  .step-tag.question{background:var(--warn-lt);color:var(--warn);}
  .step-tag.next-q{background:var(--step-lt);color:var(--step);}

  .prompt{font-family:'Playfair Display',serif;font-size:clamp(17px,3vw,22px);line-height:1.45;color:var(--ink);margin-bottom:8px;}
  .context{font-size:13.5px;color:var(--mid);line-height:1.65;margin-bottom:28px;}

  .obs-grid{display:flex;flex-direction:column;gap:14px;}
  .obs-card{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;border-radius:var(--radius);border:2px solid var(--rule);background:var(--paper);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:border-color .18s,background .18s,transform .12s;}
  .obs-card:hover{transform:translateX(4px);border-color:var(--accent);background:var(--accent-lt);}
  .obs-icon{font-size:24px;flex-shrink:0;margin-top:2px;}
  .obs-text{font-size:15px;font-weight:500;line-height:1.5;}

  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice-btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:var(--radius);border:2px solid var(--rule);background:var(--paper);cursor:pointer;text-align:left;font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);transition:border-color .18s,background .18s,transform .1s;}
  .choice-btn:hover{transform:translateX(4px);}
  .choice-btn.yes-btn{border-color:#99d4b6;background:var(--yes-lt);color:var(--yes);}
  .choice-btn.yes-btn:hover{border-color:var(--yes);}
  .choice-btn.no-btn{border-color:#f0c4a8;background:var(--no-lt);color:var(--no);}
  .choice-btn.no-btn:hover{border-color:var(--no);}
  .choice-btn .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;flex-shrink:0;}
  .yes-btn .badge{background:var(--yes);color:#fff;}
  .no-btn .badge{background:var(--no);color:#fff;}

  .caution-box{display:flex;gap:12px;background:var(--warn-lt);border-left:3px solid #c8a400;border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;margin-bottom:24px;font-size:13px;color:var(--warn);line-height:1.6;}

  .breadcrumb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;font-size:12px;color:var(--mid);}
  .crumb{display:flex;align-items:center;gap:6px;}
  .crumb span{background:var(--cream);border:1px solid var(--rule);border-radius:99px;padding:2px 10px;font-weight:500;}

  .answer-badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;margin-bottom:20px;}

  .q-block{border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;transition:box-shadow .2s;}
  .q-block.open{box-shadow:0 3px 16px rgba(59,47,110,.12);border-color:#c9c3f0;}
  .q-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--step-lt);transition:background .15s;user-select:none;}
  .q-header:hover{background:#e4e1f5;}
  .q-block.open .q-header{border-bottom:1px solid #c9c3f0;}
  .q-header-left{display:flex;align-items:flex-start;gap:10px;flex:1;}
  .q-num{font-size:11px;font-weight:700;background:var(--step);color:#fff;border-radius:99px;padding:2px 8px;flex-shrink:0;margin-top:2px;}
  .q-title{font-size:14.5px;font-weight:600;color:var(--step);line-height:1.45;}
  .q-chevron{font-size:11px;color:var(--step);flex-shrink:0;margin-top:4px;transition:transform .2s;}
  .q-block.open .q-chevron{transform:rotate(180deg);}
  .q-status-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;flex-shrink:0;margin-top:3px;}
  .q-status-pill.answered-yes{background:var(--yes);color:#fff;}
  .q-status-pill.answered-no{background:var(--no);color:#fff;}

  /* Inline Yes/No buttons on the collapsed header */
  .header-yn{display:flex;gap:5px;flex-shrink:0;align-items:center;}
  .hyn-btn{padding:4px 10px;border-radius:99px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;color:var(--mid);line-height:1;transition:border-color .15s,background .15s,color .15s;white-space:nowrap;}
  .hyn-btn:hover{border-color:var(--ink);}
  .hyn-btn.hyn-yes{border-color:var(--yes);background:var(--yes-lt);color:var(--yes);}
  .hyn-btn.hyn-no{border-color:var(--no);background:var(--no-lt);color:var(--no);}
  .q-body{display:none;padding:22px 20px;background:#fff;}
  .q-block.open .q-body{display:block;animation:fadeIn .2s ease both;}

  .next-step-box{background:var(--step-lt);border-left:3px solid var(--step);border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;margin-bottom:18px;}
  .ns-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--step);margin-bottom:6px;}
  .next-step-box p{font-size:13.5px;line-height:1.7;color:var(--ink);}

  .section-label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin-bottom:8px;}
  .section-label.blue{color:var(--accent);}
  .section-label.green{color:var(--yes);}
  .look-fors{margin-bottom:18px;}
  .lf-grid{display:flex;flex-direction:column;gap:6px;}
  .lf-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#333;line-height:1.55;padding:8px 10px;background:var(--accent-lt);border-radius:var(--radius);}
  .lf-item::before{content:'·';font-weight:900;color:var(--accent);flex-shrink:0;}
  .sample-qs{margin-bottom:18px;}
  .sq-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#333;line-height:1.55;font-style:italic;padding:8px 10px;background:var(--yes-lt);border-radius:var(--radius);margin-bottom:6px;}
  .sq-item::before{content:'"';font-weight:900;color:var(--yes);flex-shrink:0;}

  .q-answer-section{margin-top:18px;border-top:1px solid var(--rule);padding-top:16px;}
  .q-answer-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-bottom:10px;}
  .q-yn-btns{display:flex;gap:10px;margin-bottom:14px;}
  .yn-btn{flex:1;padding:10px 14px;border-radius:var(--radius);border:2px solid var(--rule);background:var(--paper);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:var(--mid);transition:border-color .15s,background .15s,color .15s;}
  .yn-btn:hover{border-color:var(--ink);}
  .yn-btn.selected-yes{border-color:var(--yes);background:var(--yes-lt);color:var(--yes);}
  .yn-btn.selected-no{border-color:var(--no);background:var(--no-lt);color:var(--no);}

  .cond-rec{border-radius:var(--radius);padding:14px 16px;font-size:13.5px;line-height:1.7;animation:fadeIn .25s ease both;}
  .cond-rec.yes-rec{background:var(--yes-lt);border-left:3px solid var(--yes);}
  .cond-rec.no-rec{background:var(--no-lt);border-left:3px solid var(--no);}
  .cond-rec .rec-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;}
  .cond-rec.yes-rec .rec-label{color:var(--yes);}
  .cond-rec.no-rec .rec-label{color:var(--no);}
  .cond-rec p{color:var(--ink);}

  .note-area{margin-top:16px;border-top:1px dashed var(--rule);padding-top:14px;}
  .note-area label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:6px;}
  .note-area textarea{width:100%;border:1.5px solid var(--rule);border-radius:var(--radius);padding:10px 12px;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);resize:vertical;min-height:72px;line-height:1.6;transition:border-color .15s;}
  .note-area textarea:focus{outline:none;border-color:var(--step);background:#fff;}
  .note-area textarea::placeholder{color:#aaa;}

  /* AI NUDGE */
  .ai-nudge{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1e2540,#2a3a6e);border-radius:var(--radius);padding:12px 16px;margin-top:14px;animation:fadeIn .3s ease both;}
  .ai-nudge .nudge-icon{font-size:20px;flex-shrink:0;}
  .ai-nudge .nudge-text{flex:1;font-size:13px;color:#c8d4f0;line-height:1.5;}
  .ai-nudge .nudge-text strong{color:#fff;}
  .nudge-ask-btn{padding:7px 14px;background:var(--accent);border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;transition:background .15s;flex-shrink:0;}
  .nudge-ask-btn:hover{background:#1e4d8c;}
  .nudge-dismiss{background:none;border:none;color:#6a7fa8;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .nudge-dismiss:hover{color:#fff;}

  .reflection-section{margin-top:36px;border-top:2px solid var(--rule);padding-top:28px;}
  .reflection-section h3{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink);margin-bottom:6px;}
  .reflection-section .ref-sub{font-size:13px;color:var(--mid);margin-bottom:18px;line-height:1.5;}
  .summary-output{background:var(--cream);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;font-size:13.5px;line-height:1.8;color:var(--ink);min-height:60px;}
  .summary-output em{color:#aaa;}
  .summary-note-row{margin-bottom:18px;}
  .summary-note-row:last-child{margin-bottom:0;}
  .sn-q{font-weight:600;font-size:13px;color:var(--step);margin-bottom:3px;}
  .sn-answered{font-size:11px;font-weight:700;display:inline-block;padding:1px 8px;border-radius:99px;margin-bottom:5px;}
  .sn-answered.yes{background:var(--yes);color:#fff;}
  .sn-answered.no{background:var(--no);color:#fff;}
  .sn-a{font-size:13px;color:var(--ink);padding-left:12px;border-left:3px solid #c9c3f0;white-space:pre-wrap;}

  .synthesize-btn{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 18px;background:linear-gradient(135deg,#1e2540,#2a3a6e);border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#fff;transition:opacity .15s;width:100%;justify-content:center;}
  .synthesize-btn:hover{opacity:.88;}
  .synthesize-btn:disabled{opacity:.4;cursor:default;}

  .reminders-section{margin-top:28px;padding-top:24px;border-top:1px solid var(--rule);}
  .reminders-section h3{font-family:'Playfair Display',serif;font-size:15px;color:var(--warn);margin-bottom:12px;}
  .reminder-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .reminder-list li{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.55;background:var(--warn-lt);border-left:3px solid #c8a400;border-radius:0 var(--radius) var(--radius) 0;padding:10px 13px;color:var(--ink);}
  .reminder-list li::before{content:'!';font-weight:700;color:var(--warn);flex-shrink:0;}

  .nav-row{display:flex;gap:12px;margin-top:28px;padding-top:24px;border-top:1px solid var(--rule);}
  .btn-back{padding:10px 20px;background:none;border:1.5px solid var(--rule);border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--mid);transition:border-color .15s,color .15s;}
  .btn-back:hover{border-color:var(--ink);color:var(--ink);}
  .btn-restart{padding:10px 20px;background:var(--ink);border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#fff;margin-left:auto;transition:background .15s;}
  .btn-restart:hover{background:var(--accent);}

  /* ═══ FLOATING CHAT BUTTON ═══ */
  #chatFab{position:fixed;bottom:28px;right:28px;z-index:200;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#2a3a6e,#1a5c38);border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .2s,box-shadow .2s;}
  #chatFab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(0,0,0,.4);}
  #fabBadge{position:absolute;top:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:#e05a2b;border:2px solid var(--paper);font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;}

  /* ═══ CHAT PANEL ═══ */
  #chatPanel{position:fixed;bottom:100px;right:24px;z-index:300;width:min(430px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 120px));background:var(--chat-bg);border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;transform:scale(.92) translateY(12px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease;}
  #chatPanel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}

  .chat-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;}
  .ch-icon{font-size:20px;}
  .ch-title{flex:1;font-size:14px;font-weight:700;color:#fff;}
  .ch-sub{font-size:11px;color:#7a90c0;display:block;font-weight:400;}
  .chat-close{background:none;border:none;color:#7a90c0;font-size:18px;cursor:pointer;padding:2px 4px;line-height:1;}
  .chat-close:hover{color:#fff;}

  .chat-context-bar{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
  .ctx-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#9ab0d4;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;}
  .ctx-chip:hover{border-color:rgba(255,255,255,.35);color:#fff;}
  .ctx-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .chat-messages{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;}
  .chat-messages::-webkit-scrollbar{width:4px;}
  .chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px;}

  .msg{max-width:88%;padding:10px 13px;border-radius:10px;font-size:13.5px;line-height:1.6;animation:fadeIn .2s ease both;}
  .msg.assistant{background:rgba(255,255,255,.1);color:#dde6f8;border-bottom-left-radius:3px;align-self:flex-start;}
  .msg.user{background:var(--accent);color:#fff;border-bottom-right-radius:3px;align-self:flex-end;}
  .msg.system{background:rgba(255,255,255,.05);color:#7a90c0;font-size:12px;font-style:italic;align-self:center;text-align:center;padding:6px 12px;}

  .typing-indicator{display:flex;gap:4px;padding:12px 14px;align-self:flex-start;}
  .typing-indicator span{width:7px;height:7px;border-radius:50%;background:#7a90c0;animation:bounce .9s infinite;}
  .typing-indicator span:nth-child(2){animation-delay:.18s;}
  .typing-indicator span:nth-child(3){animation-delay:.36s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}

  .chat-suggestions{padding:0 14px 10px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .suggestion-chip{text-align:left;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:8px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;color:#b0c4e8;line-height:1.4;transition:background .15s,border-color .15s;}
  .suggestion-chip:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;}

  .chat-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0;}
  .chat-input-row textarea{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:9px 12px;font-family:inherit;font-size:13px;color:#fff;resize:none;line-height:1.5;max-height:100px;min-height:38px;transition:border-color .15s;}
  .chat-input-row textarea:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.12);}
  .chat-input-row textarea::placeholder{color:#5a6f9a;}
  .chat-send{width:38px;height:38px;flex-shrink:0;background:var(--accent);border:none;border-radius:var(--radius);cursor:pointer;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s;align-self:flex-end;}
  .chat-send:hover{background:#1e4d8c;}
  .chat-send:disabled{opacity:.4;cursor:default;}

  @media(max-width:520px){
    header{padding:24px 20px 20px;}
    .progress-bar-wrap{padding:12px 20px;}
    main{padding:0 14px;}
    .card{padding:24px 18px;}
    #chatPanel{bottom:88px;right:12px;width:calc(100vw - 24px);}
    #chatFab{bottom:20px;right:16px;}
    .q-yn-btns{flex-direction:column;}
  }
</style>
</head>
<body>

<header>
  <div class="label">Smarter Balanced · Target Report</div>
  <h1>Table 2 — Follow-Up Questions &amp; Next Steps</h1>
  <p>An interactive guide to help school administrators interpret target-level assessment data and identify appropriate actions.</p>
</header>

<div class="progress-bar-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">Getting started</div>
</div>

<main><div class="card" id="card"></div></main>

<!-- FLOATING CHAT BUTTON -->
<button id="chatFab" onclick="toggleChat()" title="Ask the AI assistant">
  🤖<span class="fab-badge" id="fabBadge" style="display:none">!</span>
</button>

<!-- CHAT PANEL -->
<div id="chatPanel">
  <div class="chat-header">
    <span class="ch-icon">🤖</span>
    <div class="ch-title">AI Assistant<span class="ch-sub">Ask anything about your data</span></div>
    <button class="chat-close" onclick="toggleChat()">✕</button>
  </div>
  <div class="chat-context-bar" id="contextBar">
    <span class="ctx-chip active" data-ctx="general" onclick="setCtx(this,'general')">General</span>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-suggestions" id="chatSuggestions"></div>
  <div class="chat-input-row">
    <textarea id="chatInput" placeholder="Ask a follow-up question…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
      oninput="autoResize(this)"></textarea>
    <button class="chat-send" id="sendBtn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════════════════
const TREE={
  start:{type:'start'},
  s1_q1:{type:'question',obs:'DISTRICT-WIDE, a cluster of targets was "below Level 3"',question:'Was this same pattern present in previous years?',context:'Look back at prior year target report data for the same cluster of targets.',yes:'s1_yes',no:'s1_no'},
  s1_yes:{type:'multi-q',obs:'DISTRICT-WIDE, a cluster of targets was "below Level 3"',answer:'Yes — the pattern has persisted across years',questions:[
    {q:'Does the curriculum align well with these targets?',step:'If alignment is weak, explore whether supplementary materials are needed. Map the assessed standards against what is actually taught in each unit, then talk with teachers about how they approach this content.',lookFors:['Which standards these targets assess vs. what appears in the curriculum map','Depth of treatment — are targets touched briefly or taught to mastery?','Whether prerequisite skills are in place before the targets are introduced','Whether teachers can point to specific materials they use for these targets'],sampleQs:['Where in our curriculum do students actually encounter this skill?','Is this target treated as a minor topic or a major unit of study?','What does student work tell us about how deeply this is understood?'],ifYes:'Good — if the curriculum does align, shift the investigation toward implementation. Is the aligned content being taught with sufficient depth and time? Strong curriculum alignment doesn\'t guarantee strong instruction; the next question is whether aligned materials are being enacted effectively in classrooms.',ifNo:'This is a significant finding. Prioritize a curriculum audit for these specific targets — map where each assessed standard appears (or doesn\'t) in your current materials. Consider whether supplementary units or a curriculum revision are needed. Engage teachers in the audit process; they often know which gaps exist before the data shows it.'},
    {q:'Is instruction related to these targets effective?',step:'Plan classroom observations or walkthroughs specifically focused on these targets. Structured instructional rounds or lesson study cycles can surface how teachers approach the content and where students consistently struggle.',lookFors:['Whether tasks and questions align to the cognitive demand of the target','Evidence of student sense-making, not just answer-getting','How teachers respond to student confusion in the moment','Whether students can explain their thinking, not just produce answers'],sampleQs:['When you teach this skill, what do students tend to find hardest?','What does a strong student response to this type of task look like?','What instructional moves seem to help students most with this target?'],ifYes:'Instruction appears effective — but if performance is still below Level 3, look at factors outside instructional quality: coverage timing, curriculum alignment, or assessment conditions. Also consider whether instruction is consistently reaching all student groups.',ifNo:'Prioritize instructional improvement for these targets. Consider a targeted professional learning cycle: start with shared observation of student work or a model lesson, move into co-planning, and follow with structured classroom observations. Identify teachers who are finding success and create structured opportunities for peer learning.'},
    {q:'Do teachers feel comfortable teaching these targets?',step:'If comfort is low, design targeted professional learning — content-focused sessions, collaborative lesson planning, or co-teaching arrangements. Pair less confident teachers with colleagues who show strong outcomes.',lookFors:['Whether teachers can explain the standard\'s intent in their own words','Whether PD questions focus on content understanding vs. logistics','Whether there are grade-level or subject-area patterns in confidence levels'],sampleQs:['How confident do you feel teaching this particular skill or concept?','What professional learning would be most useful for you around this target?','Is there a colleague whose approach to this content you find particularly effective?'],ifYes:'If teachers feel comfortable but performance remains low, comfort alone isn\'t translating into strong outcomes. This may signal a mismatch between teachers\' sense of what "good" looks like and what the assessment actually measures. Consider sharing annotated student work samples or examining released test items together.',ifNo:'Teacher discomfort with this content is a root cause worth addressing directly. Design professional learning that goes into the content itself — what does this standard actually ask students to do? Consider multi-session content study groups or partnerships with instructional coaches.'},
    {q:'Was the content fully covered before the assessment?',step:'Review pacing guides to determine whether these targets are scheduled early enough. If they routinely appear in late-year units that get compressed, consider adjusting placement.',lookFors:['When these targets appear in the pacing guide relative to the testing window','Whether teachers report running out of time for this content','Whether these targets appear only in end-of-year units that often get shortened'],sampleQs:['By the time testing begins, have students had meaningful instruction on this target?','Are there units that routinely get compressed or skipped near the end of the year?','Could we schedule the assessment later to capture more instruction time?'],ifYes:'Good — if content is covered before testing, pacing isn\'t the primary issue. Shift focus to depth: is the content being taught with enough rigor for students to reach mastery, or is it being "covered" superficially? Review how many days are devoted to these targets.',ifNo:'This is a structural problem that requires a structural solution. Work with teachers to revise the pacing guide so these targets receive meaningful instruction well before the testing window. If adjusting the sequence isn\'t feasible, explore scheduling the summative assessment as late in the window as possible.'},
    {q:'Does this pattern hold consistently across classrooms, teachers, and schools?',step:'If consistent district-wide, this is a systemic issue requiring a systemic response. If it varies, understand what is different in classrooms with stronger outcomes and facilitate structured peer learning.',lookFors:['Which schools or classrooms show stronger performance on these targets','What is different about context, instruction, or resources in those classrooms','Whether the gap between highest and lowest performing classes is narrow or wide'],sampleQs:['Which teachers or schools are seeing better results here, and what can we learn from them?','What would it take to make what\'s working in some classrooms available to everyone?','Are there peer observation or collaborative planning structures we could put in place?'],ifYes:'A consistent pattern across the district points to a systemic cause — likely curriculum, pacing, or a gap in professional learning that everyone shares. Avoid placing the responsibility on individual teachers; instead, identify what the system needs to change.',ifNo:'The variation across classrooms is itself useful data. Some teachers are finding ways to reach students on these targets — identify them and study their practice. Create structured opportunities for peer observation and collaborative planning.'},
    {q:'What else may have influenced this observation?',step:'Name contextual factors before deciding on a response. Attendance, student mobility, new initiatives, or policy changes can all affect results in ways unrelated to curriculum or instruction quality.',lookFors:['Significant shifts in student population, attendance, or mobility rates','New initiatives that may have diverted focus or instructional time','Disruptions to the school year affecting instruction for this content'],sampleQs:['What changed in our school or district this year that might be connected to this?','Are there factors outside of instruction that could explain this pattern?','What would we need to rule out before concluding this is an instructional problem?'],ifYes:'You\'ve identified a contextual factor — be specific about how it might have affected these particular targets. Once you\'ve named the factor, decide: is it something that will persist, or a one-time event? If it\'s ongoing, it needs to be part of your improvement planning.',ifNo:'If no clear contextual factor emerges, the pattern is more likely to reflect something durable about instruction, curriculum, or teacher preparation. Return to the other questions in this section as the more likely explanations.'},
  ]},
  s1_no:{type:'multi-q',obs:'DISTRICT-WIDE, a cluster of targets was "below Level 3"',answer:'No — this is a new pattern this year',questions:[
    {q:'Did anything change since last year that might have influenced this?',step:'Identify the most likely change before designing a response. Consider teacher turnover, new curriculum adoptions, shifts in student population, new initiatives, or changes in how or when the assessment was administered.',lookFors:['Teacher turnover or significant assignment changes in affected grade levels','New curriculum materials or program adoptions since last year','Shifts in student population, attendance, or mobility','Changes to school schedule, intervention programs, or testing timing'],sampleQs:['What is different about this year compared to last — students, teachers, or programs?','Were there any new initiatives that may have taken energy away from these targets?','How confident are we this is a real shift vs. year-to-year variability?'],ifYes:'You\'ve identified a likely cause — now calibrate your response to match the type of change. If it\'s a staffing change, focus on teacher support. If it\'s a curriculum change, evaluate whether teachers had sufficient support to implement it well. Consider whether a single year of data is enough to act on.',ifNo:'If no obvious change comes to mind, this may be natural year-to-year fluctuation in target-level data. Look for corroborating evidence in interim assessments, classroom data, or teacher observation before treating this as a problem requiring action.'},
  ]},
  s2_q1:{type:'question',obs:'A target switched from above Level 3 last year to below Level 3 this year',question:'Does this decline appear broadly across teachers and classes?',context:'Check whether the decline is widespread or isolated to specific classrooms or schools.',yes:'s2_yes',no:'s2_no'},
  s2_yes:{type:'multi-q',obs:'A target switched from above Level 3 last year to below Level 3 this year',answer:'Yes — the decline appears broadly across teachers and classes',questions:[
    {q:'Did anything change since last year that might have contributed to this?',step:'Identify the most likely contributing factor before deciding on a response. If this is a single year of data, consider monitoring for another year before making sweeping changes.',lookFors:['New curriculum materials adopted or modified since last year','Changes to pacing guides that shifted when this content is taught','New district or school initiatives that may have deprioritized this area','Changes in staffing — turnover, reassignment, or new teachers at scale'],sampleQs:['What changed in our curriculum, pacing, or staffing since last year?','Did any new initiative absorb significant instructional time or teacher attention?','How confident are we this represents a real decline vs. year-to-year variability?'],ifYes:'You\'ve identified a change that likely contributed to the decline — now assess whether it\'s reversible or ongoing. If a curriculum change is the cause, evaluate whether teachers had sufficient support to implement it well before concluding the materials themselves are the problem. Document the change, your hypothesis, and the steps you\'re taking.',ifNo:'If no clear change emerges, treat this with caution before acting. A single-year decline on a specific target may reflect normal statistical variation. Look for corroborating evidence in interim assessments or classroom data before making changes.'},
  ]},
  s2_no:{type:'multi-q',obs:'A target switched from above Level 3 last year to below Level 3 this year',answer:'No — the decline is isolated to specific classes or schools',questions:[
    {q:'Is there anything unique to the classes where the change occurred?',step:'Focus support specifically on the affected classrooms — a district-wide response is not warranted. Consider targeted coaching, additional planning support, or connecting affected teachers with colleagues who maintained strong results.',lookFors:['Whether affected classes have a new, early-career, or recently reassigned teacher','Whether the student population in affected classes differs significantly','Whether those classrooms had unusual disruptions to instruction this year'],sampleQs:['What is unique about the classrooms or teachers where we saw this decline?','What specific support could we offer those teachers or those classes?','What can we learn from classrooms that maintained strong performance on this target?'],ifYes:'The uniqueness of the affected classrooms helps you target your response. If it\'s a new or early-career teacher, prioritize coaching, co-planning, and mentorship — not evaluation. If it\'s a student population shift, consider whether additional instructional supports are warranted for those students specifically.',ifNo:'If nothing obvious distinguishes the affected classrooms, dig deeper with a direct conversation with those teachers. Sometimes the cause is visible from the inside even when it\'s not apparent in the data. Approach the conversation with curiosity rather than accountability.'},
  ]},
  s3_q1:{type:'question',obs:'A target switched from below Level 3 last year to above Level 3 this year',question:'Does this improvement hold broadly across teachers and classes?',context:'Determine whether the growth is systemic or limited to particular classrooms.',yes:'s3_yes',no:'s3_no'},
  s3_yes:{type:'multi-q',obs:'A target switched from below Level 3 last year to above Level 3 this year',answer:'Yes — improvement appears broadly across teachers and classes',questions:[
    {q:'What changes were made last year that contributed to this improvement?',step:'Document what worked and actively protect it. Communicate the success to teachers and make the connection between the specific change and the outcome explicit.',lookFors:['Curriculum or instructional changes made or piloted since last year','Professional learning that focused specifically on this target','Changes to pacing that gave teachers more instructional time on this content'],sampleQs:['What did we do differently this year that may have contributed to this improvement?','How do we make sure we don\'t lose the practices that drove these gains?','Are there related targets that could benefit from the same approach?'],ifYes:'You\'ve identified what drove the improvement — now codify it. Write it down in a format that can be shared with new teachers and referenced in future planning. Consider whether this approach could be applied to other low-performing targets. Celebrate the success explicitly with teachers.',ifNo:'If you can\'t identify a clear driver, the improvement may reflect natural variation. Look for corroborating evidence in interim assessments, classroom grades, or teacher observation. If you find it, talk with teachers about what they noticed differently this year.'},
  ]},
  s3_no:{type:'multi-q',obs:'A target switched from below Level 3 last year to above Level 3 this year',answer:'No — improvement is limited to certain classes or schools',questions:[
    {q:'Were changes put in place since last year but unevenly enacted across classrooms?',step:'Identify what is working in the classrooms that improved and create structured conditions for others to learn from it. Peer observations, collaborative planning, or model lessons are more effective than top-down mandates.',lookFors:['Which classrooms or schools showed the strongest improvement','What is different about instruction, pacing, or resources in those classrooms','Whether a change was implemented more thoroughly in some places than others'],sampleQs:['What are the classrooms with the strongest gains doing differently?','Were there teachers who implemented changes more fully this year?','How can we help other classrooms access the same practices that are working?'],ifYes:'Uneven implementation is a common and solvable problem. The good news is that the practice is working — the challenge is scaling it. Focus on reducing the barriers that prevented full implementation: was it time, materials, clarity, or support? Recognize teachers who implemented successfully as leaders in this work.',ifNo:'If changes weren\'t put in place broadly, the improvement in some classrooms may reflect individual teacher initiative. Identify those teachers and learn from them. Create a structure for sharing their approach without putting pressure on them to "fix" their colleagues.'},
  ]},
};

// ═══════════════════════════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════════════════════════
let history=[],currentNode='start',notes={},answers={};
let chatOpen=false,chatCtx='general',chatHistory=[],isStreaming=false;
let nudgeDismissed={};

function nk(nid,i){return'note__'+nid+'__'+i;}
function ak(nid,i){return'ans__'+nid+'__'+i;}
function getNote(nid,i){return notes[nk(nid,i)]||'';}
function getAns(nid,i){return answers[ak(nid,i)]||null;}
function setNote(nid,i,v){notes[nk(nid,i)]=v;refreshSummary(nid);}
function setAns(nid,i,v){
  answers[ak(nid,i)]=v;
  rerenderAnswer(nid,i,v);
  refreshSummary(nid);
  showNudge(i,v,nid);
}
function syncDOM(){document.querySelectorAll('textarea[data-nk]').forEach(t=>notes[t.dataset.nk]=t.value);}
function go(nid){syncDOM();history.push(currentNode);currentNode=nid;chatCtx='general';render();}
function back(){syncDOM();if(!history.length)return;currentNode=history.pop();render();}
function restart(){syncDOM();history=[];currentNode='start';render();}
function toggleQ(i){const b=document.getElementById('qb_'+i);if(b)b.classList.toggle('open');}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════
const SCENARIOS=[
  {id:'s1_q1',icon:'📉',label:'District-wide cluster of targets below Level 3'},
  {id:'s2_q1',icon:'⬇️',label:'A target dropped: above Level 3 last year → below Level 3 this year'},
  {id:'s3_q1',icon:'⬆️',label:'A target improved: below Level 3 last year → above Level 3 this year'},
];

function render(){
  const card=document.getElementById('card');
  const nt=currentNode==='start'?'start':TREE[currentNode].type;
  const pct={start:0,question:40,'multi-q':85}[nt]||0;
  const lbl={start:'Getting started',question:'Step 1 of 2','multi-q':'Next steps'}[nt]||'';
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=lbl;
  updateContextBar();
  if(currentNode==='start') renderStart(card);
  else if(nt==='question')  renderQuestion(card,TREE[currentNode]);
  else if(nt==='multi-q')   renderMultiQ(card,TREE[currentNode]);
}

function renderStart(card){
  card.innerHTML=`
    <div class="step-tag observation">📋 Select an Observation</div>
    <div class="prompt">What did you notice in the target data?</div>
    <p class="context">Choose the observation that best matches what you're seeing. This tool guides you through follow-up questions, suggests next steps, and captures your team's thinking. The 🤖 button lets you ask an AI assistant anything at any time.</p>
    <div class="caution-box">⚠️ <div><strong>Keep in mind:</strong> Target reports show group-level averages — not individual student data. Use them alongside interim assessments, classroom data, and teacher observations for a complete picture.</div></div>
    <div class="obs-grid">${SCENARIOS.map(s=>`<button class="obs-card" onclick="go('${s.id}')"><div class="obs-icon">${s.icon}</div><div class="obs-text">${s.label}</div></button>`).join('')}</div>`;
}

function renderQuestion(card,node){
  card.innerHTML=`
    ${crumbs(node)}
    <div class="step-tag question">❓ Key Question</div>
    <div style="font-size:12px;color:var(--mid);margin-bottom:12px;font-style:italic;">Observation: ${node.obs}</div>
    <div class="prompt">${node.question}</div>
    ${node.context?`<p class="context">${node.context}</p>`:''}
    <div class="choices">
      <button class="choice-btn yes-btn" onclick="go('${node.yes}')"><span class="badge">YES</span> Yes, this pattern holds</button>
      <button class="choice-btn no-btn"  onclick="go('${node.no}')"><span class="badge">NO</span>  No, this is different or new</button>
    </div>
    <div class="nav-row"><button class="btn-back" onclick="back()">← Back</button><button class="btn-restart" onclick="restart()">Start Over</button></div>`;
}

function renderMultiQ(card,node){
  const nid=currentNode;
  const isYes=node.answer.startsWith('Yes');
  const bs=isYes?'background:var(--yes-lt);color:var(--yes);':'background:var(--no-lt);color:var(--no);';
  const anyAns=node.questions.some((_,i)=>getAns(nid,i));

  const blocks=node.questions.map((item,i)=>{
    const k=nk(nid,i),sv=notes[k]||'',sa=getAns(nid,i);
    return `
      <div class="q-block" id="qb_${i}">
        <div class="q-header">
          <div class="q-header-left" onclick="toggleQ(${i})" style="cursor:pointer;flex:1;"><span class="q-num">${i+1}</span><span class="q-title">${item.q}</span></div>
          <div style="display:flex;gap:6px;align-items:center;">
            <div class="header-yn" id="hyn_${i}">
              <button class="hyn-btn ${sa==='yes'?'hyn-yes':''}" id="hynY_${i}" onclick="setAns('${nid}',${i},'yes')">✓ Yes</button>
              <button class="hyn-btn ${sa==='no'?'hyn-no':''}"  id="hynN_${i}" onclick="setAns('${nid}',${i},'no')">✗ No</button>
            </div>
            <span class="q-chevron" id="chev_${i}" onclick="toggleQ(${i})" style="cursor:pointer;padding:4px;">▼</span>
          </div>
        </div>
        <div class="q-body" id="qbody_${i}">
          <div class="next-step-box"><div class="ns-label">→ Suggested Next Step</div><p>${item.step}</p></div>
          <div class="look-fors"><div class="section-label blue">What to look for</div><div class="lf-grid">${item.lookFors.map(l=>`<div class="lf-item">${l}</div>`).join('')}</div></div>
          <div class="sample-qs"><div class="section-label green">Sample questions to ask your team</div>${item.sampleQs.map(q=>`<div class="sq-item">${q}</div>`).join('')}</div>
          <div class="q-answer-section">
            <div class="q-answer-label">Based on your investigation, how would you answer this question?</div>
            <div class="q-yn-btns">
              <button class="yn-btn ${sa==='yes'?'selected-yes':''}" id="ybtn_${i}" onclick="setAns('${nid}',${i},'yes')">✓ Yes</button>
              <button class="yn-btn ${sa==='no'?'selected-no':''}"  id="nbtn_${i}" onclick="setAns('${nid}',${i},'no')">✗ No</button>
            </div>
            <div id="condrec_${i}">${sa?condRec(item,sa):''}</div>
            <div id="nudge_${i}"></div>
          </div>
          <div class="note-area">
            <label for="note_${i}">📝 Team notes on this question</label>
            <textarea id="note_${i}" data-nk="${k}" placeholder="What are you observing? What decisions or next steps is your team considering?" oninput="setNote('${nid}',${i},this.value)">${sv}</textarea>
          </div>
        </div>
      </div>`;
  }).join('');

  card.innerHTML=`
    ${crumbs(node)}
    <div class="step-tag next-q">📝 Additional Questions &amp; Next Steps</div>
    <div style="font-size:12px;color:var(--mid);margin-bottom:4px;font-style:italic;">Observation: ${node.obs}</div>
    <div class="answer-badge" style="${bs}">${isYes?'✓':'✗'} ${node.answer}</div>
    <p style="font-size:13px;color:var(--mid);margin-bottom:20px;line-height:1.55;">Answer <strong>Yes</strong> or <strong>No</strong> on each question directly — no need to open it first. Expand any question to see suggested next steps, what to look for, and discussion prompts. The AI assistant will offer to help after each answer.</p>
    ${blocks}
    <div class="reflection-section">
      <h3>Team Reflection Summary</h3>
      <p class="ref-sub">A running record of your team's answers and notes for this session.</p>
      <div class="summary-output" id="summaryOutput"><em>Your answers and notes will appear here as you work through the questions above.</em></div>
      <button class="synthesize-btn" id="synthesizeBtn" onclick="requestSynthesis()" ${anyAns?'':'disabled'}>🤖 Generate AI Action Plan from my answers</button>
    </div>
    <div class="reminders-section">
      <h3>⚠️ Keep in Mind</h3>
      <ul class="reminder-list">
        <li>Target data is one lens. Pair findings with classroom observations, interim assessments, and teacher input before drawing conclusions.</li>
        <li>A small number of items per target means results can fluctuate year to year — look for multi-year patterns before making large structural changes.</li>
        <li>Engage teachers in reviewing their own data first, then share district or school-level patterns as context and comparison.</li>
      </ul>
    </div>
    <div class="nav-row"><button class="btn-back" onclick="back()">← Back</button><button class="btn-restart" onclick="restart()">Start Over</button></div>`;

  toggleQ(0);
  refreshSummary(nid);
}

function condRec(item,ans){
  if(!ans)return'';
  const cls=ans==='yes'?'yes-rec':'no-rec';
  const lbl=ans==='yes'?'✓ If yes — recommendation':'✗ If no — recommendation';
  const txt=ans==='yes'?item.ifYes:item.ifNo;
  return`<div class="cond-rec ${cls}"><div class="rec-label">${lbl}</div><p>${txt}</p></div>`;
}

function rerenderAnswer(nid,i,ans){
  const node=TREE[nid];if(!node||node.type!=='multi-q')return;
  const item=node.questions[i];
  // Update body yn-btns (inside open accordion)
  const yb=document.getElementById('ybtn_'+i),nb=document.getElementById('nbtn_'+i);
  if(yb)yb.className='yn-btn'+(ans==='yes'?' selected-yes':'');
  if(nb)nb.className='yn-btn'+(ans==='no'?' selected-no':'');
  // Update header inline buttons
  const hynY=document.getElementById('hynY_'+i),hynN=document.getElementById('hynN_'+i);
  if(hynY)hynY.className='hyn-btn'+(ans==='yes'?' hyn-yes':'');
  if(hynN)hynN.className='hyn-btn'+(ans==='no'?' hyn-no':'');
  // Update conditional recommendation
  const rec=document.getElementById('condrec_'+i);if(rec)rec.innerHTML=condRec(item,ans);
  const sb=document.getElementById('synthesizeBtn');if(sb)sb.disabled=false;
}

function refreshSummary(nid){
  const out=document.getElementById('summaryOutput');if(!out)return;
  const node=TREE[nid];if(!node||node.type!=='multi-q')return;
  const rows=node.questions.map((item,i)=>{
    const ans=getAns(nid,i),note=(notes[nk(nid,i)]||'').trim();
    if(!ans&&!note)return null;
    return{q:item.q,ans,note};
  }).filter(Boolean);
  if(!rows.length){out.innerHTML='<em>Your answers and notes will appear here as you work through the questions above.</em>';return;}
  out.innerHTML=rows.map(r=>`<div class="summary-note-row"><div class="sn-q">${r.q}</div>${r.ans?`<span class="sn-answered ${r.ans}">${r.ans.toUpperCase()}</span>`:''} ${r.note?`<div class="sn-a">${r.note}</div>`:''}</div>`).join('');
}

// ═══════════════════════════════════════════════════════════════════════════
// AUTO-NUDGE
// ═══════════════════════════════════════════════════════════════════════════
function showNudge(qIdx,ans,nid){
  if(nudgeDismissed[nid+'__'+qIdx])return;
  const el=document.getElementById('nudge_'+qIdx);if(!el)return;
  el.innerHTML=`
    <div class="ai-nudge" id="nudgeBanner_${qIdx}">
      <span class="nudge-icon">🤖</span>
      <div class="nudge-text"><strong>Want to go deeper?</strong> Ask the AI assistant for more guidance on this specific question.</div>
      <button class="nudge-ask-btn" onclick="openChatForQ(${qIdx},'${nid}')">Ask Claude</button>
      <button class="nudge-dismiss" onclick="dismissNudge('${nid}',${qIdx})" title="Dismiss">✕</button>
    </div>`;
  // flash FAB badge if panel is closed
  if(!chatOpen){document.getElementById('fabBadge').style.display='flex';}
}

function dismissNudge(nid,qIdx){
  nudgeDismissed[nid+'__'+qIdx]=true;
  const el=document.getElementById('nudgeBanner_'+qIdx);if(el)el.remove();
}

function openChatForQ(qIdx,nid){
  dismissNudge(nid,qIdx);
  const node=TREE[nid];if(!node)return;
  const item=node.questions[qIdx];
  const ans=getAns(nid,qIdx);
  openChat();
  setCtxById('q_'+qIdx);
  const ansText=ans?` My team answered ${ans.toUpperCase()} to this question.`:'';
  const prompt=`I'm working through this question: "${item.q}"${ansText} Can you help me think through what to do next given my school's context?`;
  addMsg('system','Focused on: '+item.q);
  sendWithText(prompt);
}

// ═══════════════════════════════════════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════════════════════════════════════
function toggleChat(){chatOpen=!chatOpen;document.getElementById('chatPanel').classList.toggle('open',chatOpen);document.getElementById('fabBadge').style.display='none';if(chatOpen&&!chatHistory.length)initChat();}
function openChat(){chatOpen=true;document.getElementById('chatPanel').classList.add('open');document.getElementById('fabBadge').style.display='none';if(!chatHistory.length)initChat();}

function initChat(){
  chatHistory=[];
  document.getElementById('chatMessages').innerHTML='';
  addMsg('assistant','Hi! I\'m your AI assistant for this target report session. I can help you dig deeper into any question, suggest additional resources, or generate a prioritized action plan from your answers. What would you like to explore?');
  renderSuggestions();
}

function setCtx(el,ctx){chatCtx=ctx;document.querySelectorAll('.ctx-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderSuggestions();}
function setCtxById(ctx){chatCtx=ctx;document.querySelectorAll('.ctx-chip').forEach(c=>c.classList.remove('active'));const ch=document.querySelector(`.ctx-chip[data-ctx="${ctx}"]`);if(ch)ch.classList.add('active');renderSuggestions();}

function updateContextBar(){
  const bar=document.getElementById('contextBar');if(!bar)return;
  const node=currentNode==='start'?null:TREE[currentNode];
  let chips=`<span class="ctx-chip ${chatCtx==='general'?'active':''}" data-ctx="general" onclick="setCtx(this,'general')">General</span>`;
  if(node&&node.type==='multi-q'){
    node.questions.forEach((item,i)=>{
      const short=item.q.length>26?item.q.slice(0,26)+'…':item.q;
      chips+=`<span class="ctx-chip ${chatCtx==='q_'+i?'active':''}" data-ctx="q_${i}" onclick="setCtx(this,'q_${i}')">Q${i+1}: ${short}</span>`;
    });
    chips+=`<span class="ctx-chip ${chatCtx==='synthesis'?'active':''}" data-ctx="synthesis" onclick="setCtx(this,'synthesis')">Action Plan</span>`;
  }
  bar.innerHTML=chips;
}

function renderSuggestions(){
  const el=document.getElementById('chatSuggestions');if(!el)return;
  const node=currentNode==='start'?null:TREE[currentNode];
  let prompts=[];
  if(chatCtx==='general'){
    prompts=['What are the most important things to keep in mind when reading target report data?','How do I tell the difference between a real pattern and statistical noise in this data?','What other data sources should I combine with target reports for a more complete picture?'];
  } else if(chatCtx==='synthesis'){
    prompts=['Summarize my answers and generate a prioritized action plan.','What are the most urgent issues based on my answers?','Draft talking points I could share with my leadership team.'];
  } else if(chatCtx.startsWith('q_')&&node&&node.type==='multi-q'){
    const idx=parseInt(chatCtx.replace('q_',''));
    const item=node.questions[idx];
    const ans=getAns(currentNode,idx);
    prompts=[
      `I answered ${ans||'...'} to this question — what should my immediate next steps be?`,
      `What does research say about best practices related to: ${item.q.slice(0,55)}?`,
      'Help me draft a protocol for investigating this question with my leadership team.',
    ];
  }
  el.innerHTML=prompts.map(p=>`<button class="suggestion-chip" onclick="sendWithText(${JSON.stringify(p)})">${p}</button>`).join('');
}

function buildSystem(){
  const node=currentNode==='start'?null:TREE[currentNode];
  let sys=`You are an expert educational data coach helping a school or district administrator interpret Smarter Balanced target report data.
Be specific, practical, and grounded in what school leaders can actually do. Avoid generic advice. Keep responses concise (3–5 short paragraphs max unless asked for more). Use bullet points sparingly.\n\nCurrent context:`;
  if(!node){sys+='\nAdministrator is on the starting screen selecting an observation type.';}
  else if(node.type==='question'){sys+=`\nObservation: ${node.obs}\nBranching question: ${node.question}`;}
  else if(node.type==='multi-q'){
    sys+=`\nObservation: ${node.obs}\nBranching answer: ${node.answer}\n`;
    const answered=node.questions.map((item,i)=>{
      const ans=getAns(currentNode,i),note=(notes[nk(currentNode,i)]||'').trim();
      if(!ans&&!note)return null;
      return`Q: ${item.q}\nAnswer: ${ans||'(not answered)'}\nTeam notes: ${note||'(none)'}`;
    }).filter(Boolean);
    if(answered.length)sys+='\nTeam answers:\n'+answered.join('\n\n');
    if(chatCtx.startsWith('q_')){
      const idx=parseInt(chatCtx.replace('q_',''));
      const item=node.questions[idx];
      sys+=`\n\nFocused on: ${item.q}\nSuggested next step from guide: ${item.step}`;
      const ans=getAns(currentNode,idx);
      if(ans)sys+=`\nTeam answered: ${ans.toUpperCase()}\nConditional rec shown: ${ans==='yes'?item.ifYes:item.ifNo}`;
    }
  }
  return sys;
}

async function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim();if(!txt||isStreaming)return;
  inp.value='';inp.style.height='auto';
  await sendWithText(txt);
}

async function sendWithText(txt){
  if(isStreaming)return;
  addMsg('user',txt);
  chatHistory.push({role:'user',content:txt});
  showTyping();isStreaming=true;
  document.getElementById('sendBtn').disabled=true;
  document.getElementById('chatSuggestions').innerHTML='';
  try{
    const res=await fetch('https://table2-proxy.onrender.com/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:buildSystem(),messages:chatHistory}),
    });
    const data=await res.json();
    removeTyping();
    const reply=data.content?.find(b=>b.type==='text')?.text||'Sorry, I couldn\'t generate a response. Please try again.';
    addMsg('assistant',reply);
    chatHistory.push({role:'assistant',content:reply});
  }catch(e){
    removeTyping();
    addMsg('assistant','Something went wrong connecting to the AI. Please check your connection and try again.');
  }
  isStreaming=false;
  document.getElementById('sendBtn').disabled=false;
  renderSuggestions();
}

function addMsg(role,text){
  const msgs=document.getElementById('chatMessages');if(!msgs)return;
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML=text.replace(/\n/g,'<br>');
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){const msgs=document.getElementById('chatMessages');if(!msgs)return;const d=document.createElement('div');d.className='typing-indicator';d.id='typInd';d.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
function removeTyping(){const d=document.getElementById('typInd');if(d)d.remove();}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}

function requestSynthesis(){
  openChat();setCtxById('synthesis');
  const node=TREE[currentNode];if(!node||node.type!=='multi-q')return;
  const lines=node.questions.map((item,i)=>{
    const ans=getAns(currentNode,i),note=(notes[nk(currentNode,i)]||'').trim();
    return`Q${i+1}: ${item.q}\nAnswer: ${ans||'(not answered)'}\nTeam notes: ${note||'(none)'}`;
  }).join('\n\n');
  const prompt=`Please review all of my team's answers and notes below and generate a prioritized, practical action plan. Identify the 2–3 most important issues to address first, suggest concrete next steps for each, and flag anything that should be monitored vs. acted on immediately.\n\nObservation: ${node.obs}\nBranching answer: ${node.answer}\n\n${lines}`;
  addMsg('system','Generating action plan from your answers…');
  sendWithText(prompt);
}

function crumbs(node){
  const obs=node.obs||'',short=obs.length>46?obs.slice(0,46)+'…':obs;
  let parts=[`<div class="crumb"><span>All Observations</span></div>`,`<div class="crumb"><span style="color:var(--rule)">›</span><span>${short}</span></div>`];
  if(node.type==='multi-q')parts.push(`<div class="crumb"><span style="color:var(--rule)">›</span><span>Next Steps</span></div>`);
  return`<div class="breadcrumb">${parts.join('')}</div>`;
}

render();
</script>
